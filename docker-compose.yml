services:
  postgres:
    image: postgres:16-alpine
    container_name: ia-supervisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ia_supervisor
      POSTGRES_PASSWORD: ia_supervisor
      POSTGRES_DB: ia_supervisor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ia_supervisor -d ia_supervisor"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
